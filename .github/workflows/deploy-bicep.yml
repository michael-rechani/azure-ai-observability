name: Deploy Bicep to Azure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview Azure changes or apply the deployment
        required: true
        type: choice
        options:
          - what-if
          - apply
        default: what-if

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-bicep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check deployment tools
        run: |
          az version --output none
          az bicep install
          pwsh --version
      - name: Run Bicep what-if or deployment
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAMETERS: ${{ secrets.BICEP_PARAMETERS }}
          OPERATION: ${{ inputs.operation }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parametersPath = Join-Path $env:GITHUB_WORKSPACE 'infra/main.local.bicepparam'
          try {
            if ([string]::IsNullOrWhiteSpace($env:BICEP_PARAMETERS)) {
              throw 'Configure the BICEP_PARAMETERS secret in the azure-production environment.'
            }
            if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID) -or
                [string]::IsNullOrWhiteSpace($env:AZURE_RESOURCE_GROUP)) {
              throw 'Configure AZURE_SUBSCRIPTION_ID and AZURE_RESOURCE_GROUP in the azure-production environment.'
            }

            [IO.File]::WriteAllText(
              $parametersPath,
              $env:BICEP_PARAMETERS,
              [Text.UTF8Encoding]::new($false)
            )
            Remove-Item Env:BICEP_PARAMETERS

            $deploymentArguments = @(
              '-SubscriptionId', $env:AZURE_SUBSCRIPTION_ID,
              '-ResourceGroup', $env:AZURE_RESOURCE_GROUP,
              '-ParametersFile', $parametersPath
            )
            if ($env:OPERATION -eq 'what-if') {
              $deploymentArguments += '-WhatIf'
            }
            & .\scripts\deploy_bicep.ps1 @deploymentArguments
          }
          finally {
            Remove-Item -LiteralPath $parametersPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:BICEP_PARAMETERS -ErrorAction SilentlyContinue
          }
