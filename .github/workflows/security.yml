name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks (Git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan checked-out history for secrets
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  dependencies:
    name: Python example dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit resolved example dependencies
        run: |
          python -m pip install -r .github/requirements-audit.txt
          python -m pip_audit --requirement examples/requirements.txt

  infrastructure:
    name: IaC scan (Terraform and Bicep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      BC_SOURCE: disabled
      CKV_PARSE_ERROR_FAIL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan Terraform
        run: |
          python -m pip install -r .github/requirements-iac.txt
          checkov --directory terraform --framework terraform --skip-download \
            --quiet --compact --soft-fail --output cli --output sarif \
            --output-file-path console,checkov.sarif
          test -s checkov.sarif
      - name: Keep Terraform findings as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkov-sarif
          path: checkov.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Upload Terraform findings to GitHub code scanning
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov.sarif
          category: checkov-terraform
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Verify the ARM scanner
        run: |
          trivy config --disable-telemetry --skip-version-check --skip-check-update \
            --misconfig-scanners azure-arm --file-patterns 'azure-arm:.*\.json' \
            --format json --output "$RUNNER_TEMP/arm-fixture-report.json" \
            .github/fixtures/insecure-arm-2.json
          jq -e 'any(.Results[]?; .Type == "azure-arm" and
            any(.Misconfigurations[]?; .ID == "AZU-0008" and .Status == "FAIL"))' \
            "$RUNNER_TEMP/arm-fixture-report.json" > /dev/null
      - name: Compile Bicep modules
        run: |
          az bicep install
          output_dir="$RUNNER_TEMP/arm-scan"
          while IFS= read -r -d '' source; do
            relative="${source#infra/}"
            output="$output_dir/${relative%.bicep}.json"
            mkdir -p "$(dirname "$output")"
            az bicep build --file "$source" --outfile "$output"
          done < <(find infra -type f -name '*.bicep' -print0)
          test -s "$output_dir/main.json"
          test -s "$output_dir/modules/cost.json"
      - name: Scan compiled ARM templates
        run: |
          output_dir="$RUNNER_TEMP/arm-scan"
          report="$RUNNER_TEMP/bicep-arm-report.json"
          trivy config --disable-telemetry --skip-version-check --skip-check-update \
            --misconfig-scanners azure-arm --file-patterns 'azure-arm:.*\.json' \
            --include-non-failures --format json --output "$report" "$output_dir"

          while IFS= read -r -d '' template; do
            relative="${template#"$output_dir"/}"
            if ! jq -e --arg file "$relative" \
              'any(.Results[]?; .Type == "azure-arm" and (.Target | endswith($file)))' \
              "$report" > /dev/null; then
              if [[ "$relative" == "modules/budget.json" || "$relative" == "modules/cost-exports.json" ]]; then
                echo "::warning file=infra/${relative%.json}.bicep::Trivy did not recognize this subscription-scoped ARM template; review it separately."
              else
                echo "::error::Trivy did not recognize compiled ARM template $relative."
                exit 1
              fi
            fi
          done < <(find "$output_dir" -type f -name '*.json' -print0)

          jq -e 'any(.Results[]?; (.Target | endswith("modules/cost.json")) and
            any(.Misconfigurations[]?; .ID == "AZU-0056"))' "$report" > /dev/null
          {
            echo "### Bicep ARM scan"
            echo "Findings are report-only; expressions are not evaluated. See the artifact and SECURITY.md."
            jq -r '.Results[] | "- \(.Target): \(.MisconfSummary.Failures // 0) findings"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep ARM templates and findings as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bicep-arm-scan
          path: |
            ${{ runner.temp }}/arm-scan
            ${{ runner.temp }}/bicep-arm-report.json
          if-no-files-found: error
          retention-days: 7
