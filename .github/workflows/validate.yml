name: Validate monitoring assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile infrastructure without Azure login or deployment
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build-params --file infra/main.example.bicepparam --outfile "$RUNNER_TEMP/parameters.json"
      - name: Generate dashboards and check reproducibility
        run: |
          command -v pwsh >/dev/null || { echo "PowerShell 7 is required for collector tests"; exit 1; }
          python scripts/build_dashboards.py
          python scripts/build_demo_dashboards.py
          git diff --exit-code -- dashboards demo/dashboards
          python -m unittest discover -s tests -v
          python -m compileall -q scripts examples tests
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: Format, validate, and mock-test Terraform
        run: |
          terraform fmt -check -recursive terraform
          for stage in azure grafana; do
            terraform -chdir="terraform/$stage" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/$stage" validate
            terraform -chdir="terraform/$stage" test
          done
