name: Validate monitoring assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compile infrastructure without Azure login or deployment
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build-params --file infra/main.example.bicepparam --outfile "$RUNNER_TEMP/parameters.json"
      - name: Validate documentation, generate dashboards, and run tests
        run: |
          command -v pwsh >/dev/null || { echo "PowerShell 7 is required for the deployment script tests"; exit 1; }
          python scripts/build_dashboards.py
          python scripts/build_demo_dashboards.py
          git diff --exit-code -- dashboards demo/dashboards
          python -m unittest discover -s tests -v
          python -m compileall -q scripts examples tests
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
      - name: Format, validate, and mock-test Terraform
        run: |
          terraform fmt -check -recursive terraform
          for stage in azure grafana; do
            terraform -chdir="terraform/$stage" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/$stage" validate
            terraform -chdir="terraform/$stage" test
          done
