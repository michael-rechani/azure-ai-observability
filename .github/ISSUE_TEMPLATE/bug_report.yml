name: Bug report
description: A deployment, dashboard, alert or document is wrong or broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you paste anything, remove secrets, tokens, subscription and tenant IDs, real resource IDs and names, email addresses, hostnames and cost figures.

        To report a security vulnerability, use the private link on the issue chooser instead of this form.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Bicep deployment
        - Terraform deployment
        - Dashboard or panel
        - Alert rule
        - Infinity cost route
        - Documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command you ran and its error message, or the panel that looks wrong and why.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release you deployed from, and your Grafana version if you know it.
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Redacted logs, the parameters you changed, or what you already tried.
