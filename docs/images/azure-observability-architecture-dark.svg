<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1640" viewBox="0 0 1800 1640" role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">Azure AI Observatory architecture at a glance</title>
  <desc id="description">A dark, logical architecture view with numbered flows and explicit Azure trust boundaries. Existing Foundry agents and applications send OpenTelemetry traces and events to Application Insights and Log Analytics. Azure OpenAI and PTU service metrics come directly from Azure Monitor; they do not use OpenTelemetry. Azure Resource Graph supplies RBAC-filtered inventory and allocated capacity. Azure Managed Grafana uses its managed identity to query these sources and presents Foundry, agent and PTU dashboards. An optional daily Azure Function reads account-attributed costs from Cost Management and writes actual and amortized snapshots through a data collection endpoint and rule to the monitoring workspace; Function logs go to Application Insights and storage read diagnostics go to Log Analytics. Azure Monitor alerts and an optional account-filtered budget notify an action group. Terraform or Bicep deploys the observability resources; existing AI accounts are not created or resized. The diagram is logical, not a network boundary or live resource inventory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3cc3ae"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #f0f6fc; }
      .title { font-size: 34px; font-weight: 600; }
      .subtitle { font-size: 20px; fill: #a9b4c0; }
      .section { font-size: 22px; font-weight: 600; }
      .section-small { font-size: 17px; font-weight: 700; fill: #a9b4c0; letter-spacing: 0.6px; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 17px; fill: #d2dae3; }
      .small { font-size: 16px; fill: #a9b4c0; }
      .label { font-size: 15px; font-weight: 600; fill: #a9b4c0; }
      .num { font-size: 16px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .box { fill: #161b22; stroke: #526476; stroke-width: 1.5; }
      .source-group { fill: #0f2233; stroke: #377ba8; stroke-width: 1.5; }
      .data-group { fill: #111820; stroke: #526476; stroke-width: 1.5; }
      .optional { fill: #2a2516; stroke: #b79532; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .flow { fill: none; stroke: #4aa8ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .data { fill: none; stroke: #3cc3ae; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow-teal); }
      .bus { fill: none; stroke: #3cc3ae; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .divider { stroke: #344454; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1800" height="1640" fill="#0d1117"/>
  <text x="42" y="52" class="title">Azure AI Observatory — architecture at a glance</text>
  <text x="42" y="86" class="subtitle">Independent telemetry, native metrics, and optional cost signals converge in Grafana. Numbers follow the monitoring flows.</text>
  <rect x="36" y="112" width="1728" height="1341" rx="16" fill="#0d1117" stroke="#6b7c8e" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="62" y="147" class="section-small">CUSTOMER AZURE TENANT • LOGICAL VIEW, NOT A NETWORK BOUNDARY</text>
  <text x="62" y="173" class="small">Existing AI resources may span subscriptions; cost collection queries one configured subscription. Public endpoints are used by default.</text>
  <rect x="54" y="194" width="310" height="570" rx="12" class="source-group"/>
  <rect x="386" y="194" width="696" height="570" rx="12" class="data-group"/>
  <text x="66" y="207" class="section-small">EXISTING AI RESOURCES</text>
  <text x="402" y="207" class="section-small">AZURE DATA SOURCES</text>
  <text x="1195" y="207" class="section-small">DASHBOARDS AND ACCESS</text>

  <!-- Telemetry -->
  <circle cx="79" cy="225" r="15" fill="#1683d8"/><text x="79" y="231" class="num">1</text>
  <text x="105" y="232" class="section">Agent telemetry</text>
  <rect x="66" y="253" width="270" height="116" rx="10" class="box"/>
  <text x="84" y="283" class="name">Foundry agents / apps</text>
  <text x="84" y="309" class="body">Existing instrumented runtimes</text>
  <text x="84" y="337" class="small">OTel spans and events</text>
  <rect x="402" y="253" width="270" height="116" rx="10" class="box"/>
  <text x="420" y="283" class="name">Application Insights</text>
  <text x="420" y="309" class="body">Workspace-based telemetry</text>
  <text x="420" y="337" class="small">Entra-authenticated ingestion</text>
  <rect x="738" y="253" width="300" height="116" rx="10" class="box"/>
  <text x="756" y="283" class="name">Telemetry workspace</text>
  <text x="756" y="309" class="body">Log Analytics: requests,</text>
  <text x="756" y="333" class="body">dependencies and events</text>
  <text x="756" y="355" class="small">Existing or monitoring workspace</text>
  <path d="M336 311H399" class="flow"/><path d="M672 311H735" class="flow"/>
  <path d="M1038 311H1118" class="data"/>
  <line x1="62" y1="389" x2="1090" y2="389" class="divider"/>

  <!-- Metrics -->
  <circle cx="79" cy="418" r="15" fill="#1683d8"/><text x="79" y="424" class="num">2</text>
  <text x="105" y="425" class="section">OpenAI and PTU metrics</text>
  <rect x="66" y="446" width="270" height="112" rx="10" class="box"/>
  <text x="84" y="476" class="name">Existing AI accounts</text>
  <text x="84" y="502" class="body">OpenAI / Foundry deployments</text>
  <text x="84" y="530" class="small">PTU utilization, requests, tokens</text>
  <rect x="402" y="446" width="270" height="112" rx="10" class="box"/>
  <text x="420" y="476" class="name">Azure Monitor metrics</text>
  <text x="420" y="502" class="body">Native platform metrics</text>
  <text x="420" y="530" class="small">Filtered by deployment</text>
  <rect x="738" y="446" width="300" height="112" rx="10" class="box"/>
  <text x="756" y="476" class="name">Metric queries</text>
  <text x="756" y="502" class="body">Azure Monitor data source</text>
  <text x="756" y="530" class="small">No OTel exporter required</text>
  <path d="M336 502H399" class="data"/><path d="M672 502H735" class="data"/><path d="M1038 502H1118" class="data"/>
  <line x1="62" y1="578" x2="1090" y2="578" class="divider"/>

  <!-- Inventory -->
  <circle cx="79" cy="607" r="15" fill="#1683d8"/><text x="79" y="613" class="num">3</text>
  <text x="105" y="614" class="section">Resource inventory and deployed capacity</text>
  <rect x="66" y="635" width="270" height="106" rx="10" class="box"/>
  <text x="84" y="665" class="name">Azure resources</text>
  <text x="84" y="691" class="body">Accounts, ML workspaces</text>
  <text x="84" y="716" class="body">and model deployments</text>
  <rect x="402" y="635" width="270" height="106" rx="10" class="box"/>
  <text x="420" y="665" class="name">Azure Resource Graph</text>
  <text x="420" y="691" class="body">RBAC-filtered inventory</text>
  <text x="420" y="716" class="body">and allocated PTU capacity</text>
  <path d="M336 688H399" class="data"/><path d="M672 688H1118" class="data"/>

  <!-- Grafana and access -->
  <path d="M1120 311V1012" class="bus"/>
  <path d="M1120 502H1192" class="data"/>
  <rect x="1195" y="235" width="530" height="612" rx="14" fill="#10263a" stroke="#377ba8" stroke-width="1.5"/>
  <text x="1220" y="270" class="section">Azure Managed Grafana</text>
  <text x="1220" y="296" class="body">Managed identity queries permitted data sources</text>
  <rect x="1218" y="320" width="484" height="280" rx="10" fill="#111c28" stroke="#526476" stroke-width="1.5"/>
  <text x="1238" y="351" class="name">Dashboards</text>
  <text x="1238" y="384" class="body">• Foundry resource and model overview</text>
  <text x="1238" y="416" class="body">• Foundry agent operations</text>
  <text x="1238" y="448" class="body">• Azure OpenAI PTU performance</text>
  <text x="1238" y="487" class="body">• Azure AI costs <tspan class="small">(optional)</tspan></text>
  <text x="1238" y="519" class="body">• Business overview <tspan class="small">(optional)</tspan></text>
  <text x="1238" y="562" class="small">Cost and business views require cost collection.</text>
  <rect x="1218" y="624" width="484" height="96" rx="10" fill="#111c28" stroke="#526476" stroke-width="1.5"/>
  <path d="M1460 624V603" class="flow"/>
  <text x="1238" y="655" class="name">Operators and business viewers</text>
  <text x="1238" y="681" class="body">Entra authentication; Grafana Admin / Viewer roles</text>
  <text x="1220" y="756" class="small">Viewer access is not a data-isolation boundary.</text>
  <text x="1220" y="781" class="small">Scope Grafana identity access and workspace data.</text>
  <text x="1220" y="817" class="small">Blue: telemetry writes / notifications</text>
  <text x="1220" y="837" class="small">Teal dashed: queries and data returned</text>

  <!-- Cost collection -->
  <rect x="54" y="779" width="1028" height="393" rx="12" fill="#191812" stroke="#b79532" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="79" cy="812" r="15" fill="#1683d8"/><text x="79" y="818" class="num">4</text>
  <text x="105" y="819" class="section">Optional cost collection</text>
  <text x="106" y="845" class="small">Daily at 06:00 UTC • actual and amortized pretax costs for selected account IDs</text>
  <rect x="72" y="873" width="218" height="126" rx="10" class="box"/>
  <text x="88" y="902" class="name">Cost Management</text>
  <text x="88" y="927" class="body">Subscription query</text>
  <text x="88" y="951" class="body">filtered to AI accounts</text>
  <rect x="316" y="873" width="218" height="126" rx="10" class="box"/>
  <text x="332" y="902" class="name">Azure Function</text>
  <text x="332" y="927" class="body">PowerShell collector</text>
  <text x="332" y="951" class="body">Flex Consumption</text>
  <rect x="560" y="873" width="218" height="126" rx="10" class="box"/>
  <text x="576" y="902" class="name">Logs ingestion</text>
  <text x="576" y="927" class="body">Data collection</text>
  <text x="576" y="951" class="body">endpoint + rule</text>
  <rect x="804" y="873" width="250" height="126" rx="10" class="box"/>
  <text x="820" y="902" class="name">Monitoring workspace</text>
  <text x="820" y="927" class="body">AICostSnapshot_CL</text>
  <text x="820" y="951" class="body">Cost rows + run marker</text>
  <text x="820" y="975" class="small">Grafana selects complete runs</text>
  <path d="M290 936H313" class="data"/><path d="M534 936H557" class="flow"/><path d="M778 936H801" class="flow"/>
  <path d="M1054 936H1120" class="data"/>
  <rect x="72" y="1024" width="462" height="116" rx="10" fill="#211e16" stroke="#725f2e" stroke-width="1.5"/>
  <text x="88" y="1054" class="name">Function identity and storage</text>
  <text x="88" y="1080" class="body">Separate managed identity; subscription-wide</text>
  <text x="88" y="1104" class="body">Cost Management Reader; storage for the Function</text>
  <text x="88" y="1128" class="small">Function logs → App Insights; storage reads → workspace</text>
  <rect x="560" y="1024" width="494" height="116" rx="10" fill="#211e16" stroke="#725f2e" stroke-width="1.5"/>
  <text x="576" y="1054" class="name">Interpretation</text>
  <text x="576" y="1080" class="body">Billing can lag; costs are not invoice totals.</text>
  <text x="576" y="1104" class="body">Actual and amortized amounts are alternatives.</text>

  <!-- Alerts -->
  <rect x="36" y="1227" width="1728" height="226" rx="14" fill="#111923" stroke="#526476" stroke-width="1.5"/>
  <circle cx="79" cy="1261" r="15" fill="#1683d8"/><text x="79" y="1267" class="num">5</text>
  <text x="105" y="1268" class="section">Alerting and notifications</text>
  <rect x="66" y="1294" width="400" height="124" rx="10" class="box"/>
  <text x="83" y="1324" class="name">Azure Monitor alert rules</text>
  <text x="83" y="1349" class="body">PTU utilization / 429 metrics</text>
  <text x="83" y="1374" class="body">Agent failure, latency, heartbeat: optional</text>
  <text x="83" y="1398" class="small">Agent rules query the monitoring workspace.</text>
  <rect x="510" y="1294" width="367" height="124" rx="10" class="optional"/>
  <text x="528" y="1324" class="name">Cost Management budget</text>
  <text x="528" y="1349" class="body">Optional, filtered to selected accounts</text>
  <text x="528" y="1374" class="body">Threshold notification, not a spending cap</text>
  <rect x="945" y="1294" width="280" height="124" rx="10" class="box"/>
  <text x="963" y="1324" class="name">Action group</text>
  <text x="963" y="1349" class="body">Receives alert / budget</text>
  <text x="963" y="1374" class="body">notifications</text>
  <rect x="1300" y="1294" width="425" height="124" rx="10" class="box"/>
  <text x="1318" y="1324" class="name">Email recipients</text>
  <text x="1318" y="1349" class="body">Operators investigate and tune thresholds</text>
  <text x="1318" y="1374" class="small">No automatic PTU resizing or collector-failure alert.</text>
  <path d="M466 1356H490V1278H925V1356H942" class="flow"/>
  <path d="M877 1356H942" class="flow"/><path d="M1225 1356H1297" class="flow"/>

  <path d="M50 1490H170" class="flow"/>
  <text x="188" y="1496" class="small">Telemetry writes / notifications</text>
  <path d="M480 1490H600" class="data"/>
  <text x="618" y="1496" class="small">Queries / data reads</text>
  <rect x="852" y="1477" width="34" height="24" rx="5" class="optional"/>
  <text x="900" y="1496" class="small">Optional</text>
  <text x="1100" y="1496" class="small">Dashed outer line: customer tenant</text>
  <rect x="36" y="1520" width="1728" height="106" rx="12" fill="#111923" stroke="#526476" stroke-width="1.5"/>
  <text x="60" y="1554" class="name">Deployment and security</text>
  <text x="60" y="1583" class="body">Deploy with Terraform or Bicep; existing AI accounts and deployments are monitored, not created or resized.</text>
  <text x="60" y="1610" class="body">Managed identities use scoped roles. Viewer is not data isolation; the starter uses public endpoints, not private networking.</text>
</svg>
